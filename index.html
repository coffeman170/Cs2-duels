<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Duel Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: system-ui, sans-serif; user-select: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="mainMenu" class="max-w-md w-full bg-slate-900/90 p-8 rounded-2xl border border-slate-800 text-center space-y-6 shadow-2xl relative">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 uppercase pt-4">CS2 DUEL CENTER</h1>
        <p class="text-xs text-slate-400">Выберите игровой режим:</p>
        <div class="flex flex-col gap-4">
            <button onclick="openGame('csSpin')" class="py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 rounded-xl font-black text-sm uppercase tracking-wider transition shadow-lg shadow-cyan-900/40">
                🎰 CS SPIN (Дуэли)
            </button>
            <button onclick="openGame('miniGame')" class="py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 rounded-xl font-black text-sm uppercase tracking-wider transition shadow-lg shadow-emerald-900/40">
                🎲 MINI GAME 20$ (Аукцион)
            </button>
        </div>
    </div>

    <!-- ЭКРАН CS SPIN -->
    <div id="csSpinScreen" class="hidden max-w-md w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h2 class="text-cyan-400 text-lg font-black uppercase">🎰 CS Spin Duels</h2>
            <button onclick="backToMenu()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold transition">⬅️ В меню</button>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Ваш никнейм:</label>
                <input type="text" id="playerName" value="User" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-3">
                <button onclick="createRoom()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold text-sm uppercase transition shadow-lg shadow-cyan-900/30">
                    ➕ Создать комнату
                </button>
            </div>

            <div class="text-center text-xs text-slate-500 font-bold">— ИЛИ —</div>

            <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-3">
                <input type="text" id="roomCodeInput" placeholder="Код комнаты" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white text-center uppercase tracking-widest focus:outline-none focus:border-emerald-500">
                <button onclick="joinRoom()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm uppercase transition shadow-lg shadow-emerald-900/30">
                    🔗 Подключиться
                </button>
            </div>

            <div id="roomStatus" class="text-center text-xs text-slate-400"></div>
        </div>
    </div>

    <!-- ЭКРАН ИГРОВОГО ПРОЦЕССА CS SPIN -->
    <div id="csSpinGameRoom" class="hidden max-w-xl w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6 shadow-2xl text-center">
        <h2 class="text-cyan-400 text-lg font-black uppercase">⚔️ Игровая Дуэль</h2>
        <div class="text-sm text-slate-300">Комната: <span id="displayRoomCode" class="font-bold text-cyan-400"></span></div>
        <div class="grid grid-cols-2 gap-4">
            <div class="p-4 bg-slate-950 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">Игрок 1</div>
                <div id="player1NameDisplay" class="font-bold text-cyan-400 text-sm mt-1">-</div>
                <div id="p1Weapon" class="text-xs text-slate-400 mt-2">Оружие: Не выбрано</div>
            </div>
            <div class="p-4 bg-slate-950 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">Игрок 2</div>
                <div id="player2NameDisplay" class="font-bold text-emerald-400 text-sm mt-1">Ожидание...</div>
                <div id="p2Weapon" class="text-xs text-slate-400 mt-2">Оружие: Не выбрано</div>
            </div>
        </div>

        <div id="spinControlSection" class="hidden pt-4 border-t border-slate-800">
            <button onclick="spinWeapon()" id="spinBtn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 rounded-xl font-black text-sm uppercase transition shadow-lg shadow-amber-900/30 text-black">
                🎰 Крутить рулетку оружия
            </button>
        </div>

        <button onclick="backToMenu()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold transition">Выйти из комнаты</button>
    </div>

    <!-- ЭКРАН MINI GAME 20$ -->
    <div id="miniGameScreen" class="hidden max-w-2xl w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h2 class="text-emerald-400 text-lg font-black uppercase">🎲 Mini Game 20$</h2>
            <button onclick="backToMenu()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold transition">⬅️ В меню</button>
        </div>
        <div class="text-center space-y-4">
            <p class="text-sm text-slate-400">Режим аукциона и мини-игры со сгоранием средств.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cs2-duel-center-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentRoomCode = '';
        let myRole = '';
        const weapons = ['AK-47 | Redline', 'M4A1-S | Printstream', 'AWP | Asiimov', 'Desert Eagle | Printstream', 'USP-S | Cortex', 'Glock-18 | Water Elemental'];

        function openGame(type) {
            document.getElementById('mainMenu').classList.add('hidden');
            if(type === 'csSpin') {
                document.getElementById('csSpinScreen').classList.remove('hidden');
            } else if(type === 'miniGame') {
                document.getElementById('miniGameScreen').classList.remove('hidden');
            }
        }

        function backToMenu() {
            document.getElementById('csSpinScreen').classList.add('hidden');
            document.getElementById('miniGameScreen').classList.add('hidden');
            document.getElementById('csSpinGameRoom').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            if (currentRoomCode) {
                db.ref('rooms/' + currentRoomCode).off();
                currentRoomCode = '';
            }
        }

        function createRoom() {
            const name = document.getElementById('playerName').value.trim() || 'User';
            currentRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            myRole = 'player1';

            const roomData = {
                player1: name,
                player2: null,
                p1Weapon: 'Не выбрано',
                p2Weapon: 'Не выбрано',
                status: 'waiting'
            };

            db.ref('rooms/' + currentRoomCode).set(roomData).then(() => {
                showGameRoom(currentRoomCode, name, 'Ожидание соперника...');
                listenRoom();
            }).catch(err => {
                alert('Ошибка создания комнаты: ' + err.message);
            });
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value.trim() || 'User';
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if(!code) { alert('Введите код комнаты!'); return; }

            const roomRef = db.ref('rooms/' + code);
            roomRef.once('value').then((snapshot) => {
                if(snapshot.exists()) {
                    const room = snapshot.val();
                    if(room.player2) {
                        alert('Комната уже заполнена!');
                        return;
                    }
                    currentRoomCode = code;
                    myRole = 'player2';

                    roomRef.update({ player2: name, status: 'ready' }).then(() => {
                        showGameRoom(code, room.player1, name);
                        listenRoom();
                    });
                } else {
                    alert('Комната с таким кодом не найдена!');
                }
            }).catch(err => {
                alert('Ошибка подключения: ' + err.message);
            });
        }

        function showGameRoom(code, p1, p2) {
            document.getElementById('csSpinScreen').classList.add('hidden');
            document.getElementById('csSpinGameRoom').classList.remove('hidden');
            document.getElementById('displayRoomCode').innerText = code;
            document.getElementById('player1NameDisplay').innerText = p1;
            document.getElementById('player2NameDisplay').innerText = p2;
        }

        function listenRoom() {
            db.ref('rooms/' + currentRoomCode).on('value', (snapshot) => {
                if(!snapshot.exists()) return;
                const room = snapshot.val();
                document.getElementById('player1NameDisplay').innerText = room.player1 || '-';
                document.getElementById('player2NameDisplay').innerText = room.player2 || 'Ожидание...';
                document.getElementById('p1Weapon').innerText = 'Оружие: ' + (room.p1Weapon || 'Не выбрано');
                document.getElementById('p2Weapon').innerText = 'Оружие: ' + (room.p2Weapon || 'Не выбрано');

                if(room.player2 && room.status === 'ready') {
                    document.getElementById('spinControlSection').classList.remove('hidden');
                }
            });
        }

        function spinWeapon() {
            const randomWeapon = weapons[Math.floor(Math.random() * weapons.length)];
            const updateObj = {};
            if(myRole === 'player1') {
                updateObj.p1Weapon = randomWeapon;
            } else {
                updateObj.p2Weapon = randomWeapon;
            }
            db.ref('rooms/' + currentRoomCode).update(updateObj);
        }
    </script>
</body>
</html>
